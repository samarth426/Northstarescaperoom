<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Northstar Systems — a fictional cybersecurity incident investigation. An 11-level educational escape room. All people, companies, and infrastructure are fictional." />
<title>Northstar Systems — Cyber Incident Escape Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1420'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%2338bdf8'%3E%E2%AC%A2%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<a class="skip-link" href="#view">Skip to main content</a>
<div id="app">
  <header id="topbar" class="topbar" hidden>
    <div class="topbar-inner">
      <div class="brand" aria-label="Northstar Systems Investigation">
        <span class="brand-mark" aria-hidden="true">⬢</span>
        <span class="brand-text"><strong>NORTHSTAR SYSTEMS</strong><small>Incident Investigation Unit</small></span>
      </div>
      <div class="topbar-stats" role="status" aria-label="Investigation status">
        <div class="tstat"><span class="tstat-label">Operative</span><span class="tstat-value" id="hudOperative">—</span></div>
        <div class="tstat"><span class="tstat-label">Score</span><span class="tstat-value" id="hudScore">0</span></div>
        <div class="tstat"><span class="tstat-label">Progress</span><span class="tstat-value" id="hudProgress">0/11</span></div>
        <div class="tstat"><span class="tstat-label">Time</span><span class="tstat-value timer-row"><span id="hudTime" aria-live="off">00:00:00</span><button type="button" class="timer-toggle" id="hudPauseBtn" aria-pressed="false" aria-label="Pause mission timer" title="Pause mission timer">⏸</button></span><span class="timer-state is-running" id="hudTimerState"><span class="timer-dot" aria-hidden="true"></span><span id="hudTimerStateText">RUNNING</span></span></div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="btnResetTop">Reset Investigation</button>
      </div>
    </div>
    <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="hudBar"></div></div>
  </header>

  <div id="layout" class="layout" hidden>
    <nav class="sidenav" aria-label="Investigation sections">
      <button type="button" class="side-link" data-tab="investigation"><span aria-hidden="true">◎</span> Investigation</button>
      <button type="button" class="side-link" data-tab="map"><span aria-hidden="true">▦</span> Mission Map</button>
      <button type="button" class="side-link" data-tab="evidence"><span aria-hidden="true">▣</span> Evidence Locker <span class="pill" id="evCount">0</span></button>
      <button type="button" class="side-link" data-tab="notes"><span aria-hidden="true">✎</span> Notes</button>
      <button type="button" class="side-link" data-tab="help"><span aria-hidden="true">?</span> Help</button>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <main id="landingWrap">
    <div id="viewLanding"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="demoRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
